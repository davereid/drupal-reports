DataTables:
  remote: https://github.com/DataTables/DataTablesSrc
  version: 3.1.4
  license:
    name: MIT
    url: https://github.com/DataTables/DataTablesSrc/blob/master/license.txt
    gpl-compatible: true
  js:
    https://cdn.datatables.net/3.1.4/js/dataTables.min.js:
      type: external
      minified: true
  css:
    theme:
      https://cdn.datatables.net/3.1.4/css/dataTables.dataTables.min.css:
        type: external
        minified: true

report:
  js:
    js/reports.js: {}
  dependencies:
    - core/drupal
    - core/once
    # Styles item lists' list styles, e.g. comma lists in cells.
    - core/drupal.item-list
    - reports/DataTables

summary:
  css:
    component:
      css/reports.summary.css: {}

download:
  js:
    js/download.js: {}
  dependencies:
    - core/drupal
    - core/drupalSettings
