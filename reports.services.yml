services:
  _defaults:
    autowire: true
    autoconfigure: true

  # Autowired: ReportManager's constructor has #[Autowire] attributes for
  # default_plugin_manager's arguments.
  plugin.manager.report:
    class: Drupal\reports\ReportManager
  Drupal\reports\ReportManager: '@plugin.manager.report'

  reports.storage:
    class: Drupal\reports\ReportStorage
  Drupal\reports\ReportStorage: '@reports.storage'

  reports.generator:
    class: Drupal\reports\ReportGenerator
  Drupal\reports\ReportGenerator: '@reports.generator'

  # Autoconfigured as an event subscriber.
  reports.route_subscriber:
    class: Drupal\reports\Routing\ReportRouteSubscriber

  reports.param_converter:
    class: Drupal\reports\Routing\ReportParamConverter
    tags:
      - { name: paramconverter }

  logger.channel.reports:
    parent: logger.channel_base
    arguments: ['reports']
