reports.settings:
  type: config_object
  label: 'Reports settings'
  constraints:
    FullyValidatable: ~
  mapping:
    regenerate_after:
      type: integer
      label: 'Seconds after which a generated report is out of date, or 0 to never'
      constraints:
        Range:
          min: 0
    delete_after:
      type: integer
      label: 'Seconds after which generated report files are deleted on cron, or 0 to never'
      constraints:
        Range:
          min: 0
